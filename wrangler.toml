# Production deployment: Cloudflare Worker + Static Assets.
# Cloudflare Workers Builds should publish only the main branch with Preview Builds disabled.
name = "yuzhi"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "yuzhi.orangely.xyz"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
