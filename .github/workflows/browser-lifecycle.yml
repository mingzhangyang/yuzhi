name: Browser lifecycle smoke

on:
  pull_request:
    paths:
      # This smoke is an application-level lifecycle integration test. Any
      # runtime source change can affect startup, the public action surface, or
      # the writer/reader flow exercised below, so keep the trigger broad.
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'browser-tests/**'
      - 'public/browser-smoke-secondary.html'
      - '.github/workflows/browser-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - run: npm run build

      - name: Install browser smoke driver
        run: npm install --no-save --package-lock=false playwright@1.63.0

      - name: Run real Chrome lifecycle validation
        env:
          BASE_URL: http://127.0.0.1:4173
          CDP_URL: http://127.0.0.1:9222
          PW_CHANNEL: chrome
        run: |
          set -eu

          preview_pid=
          chrome_pid=

          cleanup() {
            status=$?
            if [ -n "$chrome_pid" ]; then
              kill "$chrome_pid" 2>/dev/null || true
              wait "$chrome_pid" 2>/dev/null || true
            fi
            if [ -n "$preview_pid" ]; then
              kill "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
            fi
            echo "== preview log =="
            cat /tmp/yuzhi-preview.log 2>/dev/null || true
            echo "== cdp chrome log =="
            cat /tmp/yuzhi-cdp.log 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT INT TERM

          google-chrome --version

          # Start Vite directly so the recorded PID owns the actual server
          # process instead of an npm wrapper that can leave a child behind.
          node ./node_modules/vite/bin/vite.js preview \
            --host 127.0.0.1 \
            --port 4173 \
            > /tmp/yuzhi-preview.log 2>&1 &
          preview_pid=$!

          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

          node browser-tests/input-focus-smoke.mjs
          node browser-tests/locale-smoke.mjs
          node browser-tests/capture-smoke.mjs
          node browser-tests/life-book-smoke.mjs
          node browser-tests/agenda-hit-smoke.mjs
          node browser-tests/lifecycle-smoke.mjs

          rm -rf /tmp/yuzhi-cdp-profile
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/yuzhi-cdp-profile \
            about:blank > /tmp/yuzhi-cdp.log 2>&1 &
          chrome_pid=$!

          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:9222/json/version > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:9222/json/version > /dev/null

          node browser-tests/bfcache-cdp.mjs
