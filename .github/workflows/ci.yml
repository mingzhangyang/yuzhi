name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify calendar fixtures across supported timezones
        run: |
          for tz in UTC Asia/Shanghai America/New_York; do
            echo "== TZ=$tz =="
            TZ="$tz" npm test -- tests/ics.test.ts --reporter=dot
          done
      - run: npm run build
      - run: npm run check:worker
